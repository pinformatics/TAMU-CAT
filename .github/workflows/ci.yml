name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            output_file="$(mktemp)"
            if bin/importmap audit 2>&1 | tee "${output_file}"; then
              rm -f "${output_file}"
              exit 0
            fi
            if ! grep -q "Unexpected transport error" "${output_file}"; then
              rm -f "${output_file}"
              exit 1
            fi
            rm -f "${output_file}"
            if [ "${attempt}" -lt 3 ]; then
              echo "Importmap audit attempt ${attempt} failed; retrying."
            fi
          done
          echo "::warning::Importmap audit could not reach the npm advisory service after 3 attempts; retrying the audit is required before release."

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config google-chrome-stable

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --command "ALTER USER postgres PASSWORD 'postgres';"
          pg_isready -h localhost -p 5432 -U postgres

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare disposable test credentials
        env:
          RAILS_ENV: test
        run: |
          rm -f config/credentials/test.yml.enc config/credentials/test.key
          EDITOR=true bin/rails credentials:edit --environment test

      - name: Setup DB
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
        run: bin/rails db:create db:migrate --trace RAILS_ENV=test

      - name: Run tests
        env:
          RAILS_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PARALLEL_WORKERS: 1
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Upload tmp folder
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tmp-artifacts
          path: ${{ github.workspace }}/tmp/
          if-no-files-found: ignore
