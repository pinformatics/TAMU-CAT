name: tamu-cat

services:
  db:
    image: postgres:17
    container_name: tamu-cat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pass}
      POSTGRES_DB: ${LOCAL_DATABASE:-tamu_cat_development}
    ports:
      - "5433:5432" 
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  web:
    build:
      context: .
      args:
        RUBY_VERSION: 3.4.6
      target: dev
    container_name: tamu-cat-web
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-dev_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev_pass}
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-dev_user}:${POSTGRES_PASSWORD:-dev_pass}@db:5432/${LOCAL_DATABASE:-tamu_cat_development}}
      DATABASE: ${LOCAL_DATABASE:-tamu_cat_development}
      PIDFILE: /app/tmp/pids/server.pid
      RAILS_ENV: development
      RAILS_MAX_THREADS: 5
      SOLID_QUEUE_IN_PUMA: ""
      BUNDLE_WITHOUT: ""
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app:cached
      - bundle-cache:/usr/local/bundle
    working_dir: /app
    depends_on:
      - db
    command: bash -lc "bundle check || bundle install; bin/rails db:prepare; rm -f tmp/pids/server.pid && bin/rails tailwindcss:build && bin/rails s -b 0.0.0.0 -p 3000"

  css:
    build:
      context: .
      args:
        RUBY_VERSION: 3.4.6
      target: dev
    container_name: tamu-cat-css
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-dev_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev_pass}
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-dev_user}:${POSTGRES_PASSWORD:-dev_pass}@db:5432/${LOCAL_DATABASE:-tamu_cat_development}}
      DATABASE: ${LOCAL_DATABASE:-tamu_cat_development}
      RAILS_ENV: development
      BUNDLE_WITHOUT: ""
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
    volumes:
      - .:/app:cached
      - bundle-cache:/usr/local/bundle
    working_dir: /app
    depends_on:
      - db
    command: bash -lc "bundle check || bundle install; bin/rails tailwindcss:watch"

volumes:
  db-data:
  bundle-cache:
